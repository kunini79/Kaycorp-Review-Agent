services:
  api:
    build: .
    command: sh -c "python -m app.ensure_data && uvicorn app.api:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data/raw:/app/data/raw
      - ./data/processed:/app/data/processed

  streamlit:
    build: .
    command: sh -c "python -m app.ensure_data && streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501"
    ports:
      - "8501:8501"
    volumes:
      - ./data/raw:/app/data/raw
      - ./data/processed:/app/data/processed
    depends_on:
      - api
